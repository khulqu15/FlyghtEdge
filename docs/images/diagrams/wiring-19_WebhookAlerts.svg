<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 358" width="780" height="358" role="img" aria-label="Webhook door alert: wiring">
<title>Webhook door alert: wiring</title>
<rect width="780" height="358" rx="12" fill="#f8fafc"/>
<text x="24" y="34" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" fill="#0f172a" font-weight="600">Webhook door alert: wiring</text>
<text x="24" y="52" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#64748b">Signal names are the constants at the top of the example; the GPIO numbers are in the table below.</text>
<rect x="24" y="64" width="210" height="154" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="129" y="86" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">ESP32 board</text>
<circle cx="234" cy="108" r="4" fill="#2563eb"/>
<text x="220" y="112" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#0f172a" text-anchor="end">SWITCH_PIN</text>
<circle cx="234" cy="204" r="4" fill="#334155"/>
<text x="220" y="208" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#64748b" text-anchor="end">GND</text>
<rect x="470" y="64" width="286" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="484" y="86" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#0f172a" font-weight="600">Door switch (or the BOOT button)</text>
<circle cx="470" cy="111" r="4" fill="#2563eb"/>
<text x="484" y="115" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#0f172a">one side</text>
<path d="M238,108 C344,108 360,111 466,111" fill="none" stroke="#2563eb" stroke-width="2"/>
<circle cx="470" cy="137" r="4" fill="#334155"/>
<text x="484" y="141" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#0f172a">other side</text>
<path d="M238,204 C344,204 360,137 466,137" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="5 4"/>
<text x="24" y="266" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="600">GPIO numbers</text>
<rect x="24" y="276" width="732" height="24" rx="6" fill="#e2e8f0"/>
<text x="34" y="292" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#0f172a" font-weight="600">Signal</text>
<text x="240" y="292" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#0f172a" font-weight="600">ESP32</text>
<text x="370" y="292" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#0f172a" font-weight="600">ESP32-S3</text>
<text x="500" y="292" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#0f172a" font-weight="600">C3 / C6 / S2</text>
<line x1="24" y1="320" x2="756" y2="320" stroke="#cbd5e1"/>
<text x="34" y="314" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#0f172a">SWITCH_PIN</text>
<text x="240" y="314" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#0f172a">GPIO 0</text>
<text x="370" y="314" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#0f172a">GPIO 0</text>
<text x="500" y="314" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#0f172a">GPIO 9</text>
<text x="24" y="346" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#64748b">Pins are chosen away from flash, USB and boot pins. Power rails: 3V3 and 5V are the board’s own; always share GND.</text>
</svg>
