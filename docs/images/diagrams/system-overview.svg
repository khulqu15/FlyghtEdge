<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" role="img" aria-label="FlyghtEdge system overview">
<title>FlyghtEdge system overview</title>
<rect width="820" height="470" rx="12" fill="#f8fafc"/>
<text x="24" y="34" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" fill="#0f172a" font-weight="600">FlyghtEdge: what runs on the board and what it talks to</text>
<text x="24" y="54" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#64748b">Everything inside the dashed box is one firmware. Only the parts your sketch creates are linked in.</text>
<rect x="250" y="76" width="320" height="372" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="410" y="100" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#2563eb" font-weight="600" text-anchor="middle">ESP32 firmware</text>
<rect x="270" y="114" width="280" height="48" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="410" y="136" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">Your sketch</text>
<text x="410" y="153" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">pages, widgets, callbacks, loop()</text>
<rect x="270" y="178" width="134" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="337" y="202" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">Dashboard</text>
<text x="337" y="219" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">web UI, API, login</text>
<rect x="416" y="178" width="134" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="483" y="202" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">Wi-Fi + setup</text>
<text x="483" y="219" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">portal, mDNS, AP</text>
<rect x="270" y="244" width="134" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="337" y="268" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">MQTT</text>
<text x="337" y="285" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Home Assistant</text>
<rect x="416" y="244" width="134" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="483" y="268" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">Webhook</text>
<text x="483" y="285" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">signed HTTPS POST</text>
<rect x="270" y="310" width="134" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="337" y="334" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">Flows</text>
<text x="337" y="351" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">visual rules</text>
<rect x="416" y="310" width="134" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="483" y="334" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">Flyght Cloud</text>
<text x="483" y="351" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">claim + mirror</text>
<rect x="270" y="378" width="280" height="56" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="410" y="404" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">Devices</text>
<text x="410" y="421" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">relays, sensors, motors, GPS, TFT, SD, LCD, IMU</text>
<rect x="24" y="178" width="180" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="114" y="202" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">Phone / browser</text>
<text x="114" y="219" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">on the same Wi-Fi or the setup AP</text>
<rect x="24" y="244" width="180" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="114" y="268" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">MQTT broker</text>
<text x="114" y="285" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Home Assistant, Node-RED</text>
<rect x="24" y="378" width="180" height="56" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="114" y="404" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">GPIO, I2C, SPI, UART</text>
<text x="114" y="421" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">the parts on your bench</text>
<rect x="616" y="244" width="180" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="706" y="268" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">Your server</text>
<text x="706" y="285" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">n8n, Node-RED, any receiver</text>
<rect x="616" y="310" width="180" height="52" rx="10" fill="#eff6ff" stroke="#2563eb"/>
<text x="706" y="334" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">Flyght Cloud</text>
<text x="706" y="351" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">flyght.obayan.id</text>
<path d="M204,204 L262,204" stroke="#2563eb" stroke-width="2" fill="none"/>
<polygon points="270,204 260,199 260,209" fill="#2563eb"/>
<text x="237" y="198" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">HTTP</text>
<path d="M204,270 L262,270" stroke="#2563eb" stroke-width="2" fill="none"/>
<polygon points="270,270 260,265 260,275" fill="#2563eb"/>
<text x="237" y="264" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">MQTT</text>
<path d="M550,270 L608,270" stroke="#2563eb" stroke-width="2" fill="none"/>
<polygon points="616,270 606,265 606,275" fill="#2563eb"/>
<text x="583" y="264" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">HTTPS</text>
<path d="M550,336 L608,336" stroke="#2563eb" stroke-width="2" fill="none"/>
<polygon points="616,336 606,331 606,341" fill="#2563eb"/>
<text x="583" y="330" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">MQTT over TLS</text>
<path d="M204,406 L262,406" stroke="#2563eb" stroke-width="2" fill="none"/>
<polygon points="270,406 260,401 260,411" fill="#2563eb"/>
<text x="237" y="400" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">pins</text>
</svg>
