<text x="24" y="616" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#64748b">Pins are chosen away from flash, USB and boot pins. Power rails: 3V3 and 5V are the board’s own; always share GND.</text>
