<text x="24" y="480" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b">GPIO 24–30 are the SPI flash. GPIO 12 and 13 are the native USB pins.</text>
<text x="24" y="500" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b">GPIO 8, 9 and 15 are boot pins; check your board for the on-board LED and button.</text>
