<text x="24" y="418" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b">GPIO 12–17 are the SPI flash. GPIO 18 and 19 are the native USB pins.</text>
<text x="24" y="438" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b">GPIO 8 and 9 are boot pins; GPIO 9 is the BOOT button on most boards.</text>
<text x="24" y="462" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#64748b">"Serial" marks the console UART, "ADC1" the analog inputs that keep working with Wi-Fi.</text>
